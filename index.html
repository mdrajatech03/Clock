<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Clock Pro - Fixed Version</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1e23; padding: 20px; }
        .container { position: relative; background: #2f363e; border-radius: 30px; box-shadow: 25px 25px 75px rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 40px 20px; width: 100%; max-width: 450px; }
        #date-box { color: #fff; font-size: 1.1em; margin-bottom: 20px; opacity: 0.8; }
        .clock { position: relative; width: 250px; height: 250px; background: #2f363e; border-radius: 50%; box-shadow: inset 5px 5px 10px rgba(0,0,0,0.5), inset -5px -5px 15px rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; margin-bottom: 30px; }
        .clock span { position: absolute; inset: 15px; transform: rotate(calc(30deg * var(--i))); text-align: center; color: #fff; }
        .clock span b { font-size: 1.2em; opacity: 0.2; display: inline-block; transform: rotate(calc(-30deg * var(--i))); }
        .circle { position: absolute; width: 90%; height: 90%; display: flex; justify-content: center; align-items: flex-start; }
        .circle i { position: absolute; width: 4px; height: 50%; background: var(--clr); border-radius: 4px; transform-origin: bottom; transform: scaleY(0.5); }
        #time { display: flex; margin-bottom: 20px; font-size: 2em; font-weight: 600; }
        #time div { width: 60px; text-align: center; color: var(--clr); }
        .controls { display: flex; flex-direction: column; gap: 15px; align-items: center; width: 100%; }
        input[type="time"] { background: #1a1e23; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 12px; outline: none; }
        button { padding: 12px 30px; border-radius: 30px; border: none; background: #04fc43; color: #1a1e23; font-weight: 600; cursor: pointer; transition: 0.3s; }
        #stopBtn { background: #ff2972; color: #fff; display: none; margin-top: 10px; }
        #alarmStatus { color: #04fc43; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

    <audio id="alarmAudio" preload="auto" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="date-box">Loading...</div>
        <div class="clock">
            <div class="circle" id="sc" style="--clr:#04fc43;"><i></i></div>
            <div class="circle circle2" id="mn" style="--clr:#fee800;"><i></i></div>
            <div class="circle circle3" id="hr" style="--clr:#ff2972;"><i></i></div>
            <span style="--i:1;"><b>1</b></span><span style="--i:2;"><b>2</b></span><span style="--i:3;"><b>3</b></span><span style="--i:4;"><b>4</b></span><span style="--i:5;"><b>5</b></span><span style="--i:6;"><b>6</b></span><span style="--i:7;"><b>7</b></span><span style="--i:8;"><b>8</b></span><span style="--i:9;"><b>9</b></span><span style="--i:10;"><b>10</b></span><span style="--i:11;"><b>11</b></span><span style="--i:12;"><b>12</b></span>
        </div>
        <div id="time">
            <div id="hours" style="--clr:#ff2972;">00</div>
            <div id="minutes" style="--clr:#fee800;">00</div>
            <div id="seconds" style="--clr:#04fc43;">00</div>
        </div>
        <div class="controls">
            <input type="time" id="alarmTime">
            <button id="setBtn" onclick="setAlarm()">Set Alarm</button>
            <button id="stopBtn" onclick="stopAlarm()">Stop Alarm</button>
            <p id="alarmStatus"></p>
        </div>
    </div>

    <script>
        const alarmAudio = document.getElementById('alarmAudio');
        const alarmInput = document.getElementById('alarmTime');
        const alarmStatus = document.getElementById('alarmStatus');
        const stopBtn = document.getElementById('stopBtn');

        // 1. REFRESH FIX: Page load hote hi purana alarm check karein
        window.onload = () => {
            let savedAlarm = localStorage.getItem('userAlarm');
            if(savedAlarm) {
                alarmInput.value = savedAlarm;
                alarmStatus.innerHTML = "⏰ Active: " + savedAlarm;
            }
        };

        function setAlarm() {
            const timeVal = alarmInput.value;
            if(timeVal) {
                localStorage.setItem('userAlarm', timeVal);
                alarmStatus.innerHTML = "⏰ Alarm set for " + timeVal;
                
                // AUDIO FIX: Silent play taaki browser audio allow kar de
                alarmAudio.play().then(() => {
                    alarmAudio.pause();
                    alarmAudio.currentTime = 0;
                });
                
                alert("Alarm Set & Audio Unblocked!");
            } else {
                alert("Please select a time!");
            }
        }

        function stopAlarm() {
            alarmAudio.pause();
            alarmAudio.currentTime = 0;
            stopBtn.style.display = "none";
            localStorage.removeItem('userAlarm');
            alarmStatus.innerHTML = "Alarm Cleared.";
        }

        setInterval(() => {
            let now = new Date();
            let hh = now.getHours();
            let mm = now.getMinutes();
            let ss = now.getSeconds();

            // Clock Hands Update
            document.querySelector('#hr').style.transform = `rotateZ(${(hh * 30) + (mm / 12)}deg)`;
            document.querySelector('#mn').style.transform = `rotateZ(${mm * 6}deg)`;
            document.querySelector('#sc').style.transform = `rotateZ(${ss * 6}deg)`;

            // Digital Update
            document.getElementById('hours').innerHTML = hh.toString().padStart(2, '0');
            document.getElementById('minutes').innerHTML = mm.toString().padStart(2, '0');
            document.getElementById('seconds').innerHTML = ss.toString().padStart(2, '0');

            // ALARM TRIGGER
            let currentTimeStr = hh.toString().padStart(2, '0') + ":" + mm.toString().padStart(2, '0');
            let savedAlarmTime = localStorage.getItem('userAlarm');

            if (savedAlarmTime === currentTimeStr && ss === 0) {
                alarmAudio.play();
                stopBtn.style.display = "block";
                alarmStatus.innerHTML = "🚀 WAKE UP!";
            }
        }, 1000);
    </script>
</body>
</html>
