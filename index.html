<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Smart Clock - Master Fix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

        :root {
            --bg-color: #e0e0e0;
            --text-color: #444;
            --shadow-light: #ffffff;
            --shadow-dark: #bebebe;
            --accent-color: #04fc43;
            /* Hand Colors */
            --hr-color: #ff5e5e; 
            --mn-color: #5eafff;
        }

        [data-theme="dark"] {
            --bg-color: #1a1e23;
            --text-color: #ddd;
            --shadow-light: #252a31;
            --shadow-dark: #0f1216;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; transition: 0.3s; }

        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: var(--bg-color); padding: 20px;
        }

        /* Audio Unlock Overlay */
        #overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); z-index: 999;
            display: flex; justify-content: center; align-items: center;
            color: white; text-align: center; cursor: pointer;
        }

        .top-bar {
            position: fixed; top: 15px; width: 90%; max-width: 400px;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }

        .info-pill {
            padding: 8px 12px; border-radius: 20px; font-size: 0.7em; font-weight: 600;
            background: var(--bg-color); color: var(--text-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border: none;
        }

        .container {
            background: var(--bg-color); border-radius: 40px;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            display: flex; flex-direction: column; align-items: center;
            padding: 30px 20px; width: 100%; max-width: 380px; margin-top: 40px;
        }

        .clock {
            position: relative; width: 220px; height: 220px;
            background: var(--bg-color); border-radius: 50%;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light),
                        inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            display: flex; justify-content: center; align-items: center; margin-bottom: 25px;
        }

        .circle { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; }
        .circle i { position: absolute; border-radius: 6px; transform-origin: bottom; }
        
        /* Different Colors for Hands */
        #hr i { height: 25%; width: 7px; top: 25%; background: var(--hr-color); box-shadow: 0 0 10px var(--hr-color); }
        #mn i { height: 35%; width: 4px; top: 15%; background: var(--mn-color); box-shadow: 0 0 10px var(--mn-color); }
        #sc i { height: 40%; width: 2px; top: 10%; background: var(--accent-color); box-shadow: 0 0 10px var(--accent-color); }

        .clock span { position: absolute; inset: 15px; text-align: center; color: var(--text-color); transform: rotate(calc(30deg * var(--i))); opacity: 0.5; }
        .clock span b { display: inline-block; transform: rotate(calc(-30deg * var(--i))); }

        #time-display {
            font-size: 1.8em; font-weight: 600; color: var(--text-color);
            background: var(--bg-color); padding: 12px 25px; border-radius: 20px; margin-bottom: 20px;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
        }

        .controls { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
        
        select, input[type="time"] {
            width: 85%; background: var(--bg-color); border: none; padding: 12px; border-radius: 12px;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--text-color); outline: none;
        }

        button {
            padding: 12px 25px; border-radius: 25px; border: none; cursor: pointer;
            background: var(--bg-color); color: var(--text-color); font-weight: 600;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        #stopBtn { color: #ff2972; display: none; margin-top: 10px; border: 1px solid #ff2972; }
        #alarmStatus { color: var(--accent-color); font-weight: 600; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="overlay" onclick="initAudio()">
        <div>
            <h1>🔔</h1>
            <p>Tap anywhere to enable Smart Clock & Sound</p>
        </div>
    </div>

    <div class="top-bar">
        <div class="info-pill" id="battery">🔋 --%</div>
        <div class="info-pill">🎨 <input type="color" id="colorPicker" oninput="updateAccent(this.value)" style="border:none; width:20px; background:none; cursor:pointer;"></div>
        <button class="info-pill" onclick="toggleTheme()">🌓 Theme</button>
    </div>

    <audio id="alarmAudio" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="weather-status" style="font-size: 0.8em; color: var(--accent-color); margin-bottom: 10px;">Weather: Loading...</div>
        
        <div class="clock">
            <div class="circle" id="hr"><i></i></div>
            <div class="circle" id="mn"><i></i></div>
            <div class="circle" id="sc"><i></i></div>
            <span style="--i:1;"><b>1</b></span><span style="--i:2;"><b>2</b></span><span style="--i:3;"><b>3</b></span>
            <span style="--i:4;"><b>4</b></span><span style="--i:5;"><b>5</b></span><span style="--i:6;"><b>6</b></span>
            <span style="--i:7;"><b>7</b></span><span style="--i:8;"><b>8</b></span><span style="--i:9;"><b>9</b></span>
            <span style="--i:10;"><b>10</b></span><span style="--i:11;"><b>11</b></span><span style="--i:12;"><b>12</b></span>
        </div>

        <div id="time-display">00:00:00</div>

        <div class="controls">
            <select id="soundSelect" onchange="previewSound()">
                <option value="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3">Classic Bell</option>
                <option value="https://www.soundjay.com/buttons/beep-01a.mp3">Digital Beep</option>
                <option value="https://www.soundjay.com/clock/alarm-clock-01.mp3">Retro Alarm</option>
            </select>

            <input type="time" id="alarmTime">
            <button onclick="setAlarm()">Set Alarm</button>
            <button id="stopBtn" onclick="stopAlarm()">STOP ALARM</button>
            <p id="alarmStatus"></p>
        </div>
    </div>

    <script>
        const audio = document.getElementById('alarmAudio');
        let alarmTime = null;
        let isRinging = false;

        // 1. SOUND FIX: Browser requires user interaction
        function initAudio() {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                document.getElementById('overlay').style.display = 'none';
            }).catch(e => console.log("Waiting for interaction"));
        }

        function updateAccent(color) {
            document.documentElement.style.setProperty('--accent-color', color);
            localStorage.setItem('userThemeColor', color);
        }

        function previewSound() {
            audio.src = document.getElementById('soundSelect').value;
            audio.play();
            setTimeout(() => { if(!isRinging) audio.pause(); }, 2000);
        }

        function setAlarm() {
            const input = document.getElementById('alarmTime').value;
            if(input) {
                alarmTime = input;
                document.getElementById('alarmStatus').innerText = "⏰ Alarm set for " + alarmTime;
                alert("Alarm Set!");
            }
        }

        function stopAlarm() {
            audio.pause();
            audio.currentTime = 0;
            isRinging = false;
            alarmTime = null;
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('alarmStatus').innerText = "Alarm Stopped.";
        }

        // Main Clock Loop
        setInterval(() => {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            // Display
            document.getElementById('time-display').innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;

            // Hands Logic
            document.getElementById('hr').style.transform = `rotate(${(h * 30) + (m / 2)}deg)`;
            document.getElementById('mn').style.transform = `rotate(${m * 6}deg)`;
            document.getElementById('sc').style.transform = `rotate(${s * 6}deg)`;

            // Alarm Check
            const currentTimeStr = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            if(alarmTime === currentTimeStr && s === 0 && !isRinging) {
                isRinging = true;
                audio.play();
                document.getElementById('stopBtn').style.display = 'block';
            }
        }, 1000);

        function toggleTheme() {
            const b = document.body;
            b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        // Extra info
        navigator.getBattery?.().then(b => {
            const u = () => document.getElementById('battery').innerText = `🔋 ${Math.round(b.level * 100)}%`;
            u(); b.onlevelchange = u;
        });

        window.onload = () => {
            const savedColor = localStorage.getItem('userThemeColor');
            if(savedColor) updateAccent(savedColor);
        };
    </script>
</body>
</html>
