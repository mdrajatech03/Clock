<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Clock - Theme Fixed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

        :root {
            --bg-color: #e0e0e0;
            --text-color: #444;
            --shadow-light: #ffffff;
            --shadow-dark: #bebebe;
            --accent-color: #04fc43;
        }

        [data-theme="dark"] {
            --bg-color: #1a1e23;
            --text-color: #ddd;
            --shadow-light: #252a31;
            --shadow-dark: #0f1216;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; transition: background 0.3s, color 0.3s; }

        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: var(--bg-color); padding: 20px;
        }

        /* --- Theme Button Fix --- */
        .theme-switch {
            position: fixed; top: 20px; right: 20px;
            padding: 12px 20px; border-radius: 30px; border: none;
            background: var(--bg-color); color: var(--text-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            cursor: pointer; font-weight: 600; z-index: 2000;
        }

        .container {
            background: var(--bg-color); border-radius: 40px;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 25px; width: 100%; max-width: 380px;
        }

        #date-box { color: var(--text-color); font-size: 1em; margin-bottom: 20px; font-weight: 500; }

        /* --- Clock Fix --- */
        .clock {
            position: relative; width: 250px; height: 250px;
            background: var(--bg-color); border-radius: 50%; border: none;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light),
                        inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            display: flex; justify-content: center; align-items: center; margin-bottom: 30px;
        }

        .clock span {
            position: absolute; inset: 15px; text-align: center; color: var(--text-color);
            transform: rotate(calc(30deg * var(--i))); opacity: 0.5;
        }
        .clock span b { display: inline-block; transform: rotate(calc(-30deg * var(--i))); }

        .circle { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; }
        .circle i { position: absolute; border-radius: 6px; transform-origin: bottom; background: var(--clr); }
        
        #hr i { height: 25%; width: 6px; top: 25%; }
        #mn i { height: 35%; width: 4px; top: 15%; }
        #sc i { height: 40%; width: 2px; top: 10%; }

        /* --- Digital Display Fix (Spacing & Colon) --- */
        #time {
            display: flex; align-items: center; gap: 10px; margin-bottom: 25px; 
            font-size: 2em; font-weight: 600; color: var(--text-color);
            background: var(--bg-color); padding: 10px 20px; border-radius: 15px;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }
        .colon { opacity: 0.5; font-size: 0.8em; padding-bottom: 4px; }

        .controls { display: flex; flex-direction: column; gap: 15px; align-items: center; width: 100%; }

        input[type="time"] {
            background: var(--bg-color); border: none; color: var(--text-color);
            padding: 12px; border-radius: 12px; outline: none;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        .btn-row { display: flex; gap: 10px; }

        button.action-btn {
            padding: 10px 20px; border-radius: 25px; border: none;
            background: var(--bg-color); color: var(--text-color); font-weight: 600;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer;
        }

        button.action-btn:active { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); }
        #stopBtn { color: #ff2972; display: none; }
        #alarmStatus { color: var(--accent-color); font-size: 0.8em; margin-top: 10px; }
    </style>
</head>
<body>

    <button class="theme-switch" onclick="toggleTheme()">🌓 Change Theme</button>

    <audio id="alarmAudio" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="date-box">Loading...</div>
        
        <div class="clock">
            <div class="circle" id="hr" style="--clr:var(--text-color);"><i></i></div>
            <div class="circle" id="mn" style="--clr:#888;"><i></i></div>
            <div class="circle" id="sc" style="--clr:var(--accent-color);"><i></i></div>
            <span style="--i:1;"><b>1</b></span><span style="--i:2;"><b>2</b></span><span style="--i:3;"><b>3</b></span>
            <span style="--i:4;"><b>4</b></span><span style="--i:5;"><b>5</b></span><span style="--i:6;"><b>6</b></span>
            <span style="--i:7;"><b>7</b></span><span style="--i:8;"><b>8</b></span><span style="--i:9;"><b>9</b></span>
            <span style="--i:10;"><b>10</b></span><span style="--i:11;"><b>11</b></span><span style="--i:12;"><b>12</b></span>
        </div>

        <div id="time">
            <div id="hours">00</div>
            <span class="colon">:</span>
            <div id="minutes">00</div>
            <span class="colon">:</span>
            <div id="seconds" style="color:var(--accent-color);">00</div>
        </div>

        <div class="controls">
            <input type="time" id="alarmTime">
            <div class="btn-row">
                <button class="action-btn" onclick="setAlarm()">Set Alarm</button>
                <button id="stopBtn" class="action-btn" onclick="stopAlarm()">Stop</button>
            </div>
            <p id="alarmStatus"></p>
        </div>
    </div>

    <script>
        const alarmAudio = document.getElementById('alarmAudio');
        let activeAlarm = localStorage.getItem('userAlarm');

        function toggleTheme() {
            const body = document.body;
            const newTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        window.onload = () => {
            if(activeAlarm) {
                document.getElementById('alarmTime').value = activeAlarm;
                document.getElementById('alarmStatus').innerHTML = "⏰ Active: " + activeAlarm;
            }
        };

        function setAlarm() {
            const val = document.getElementById('alarmTime').value;
            if(val) {
                activeAlarm = val;
                localStorage.setItem('userAlarm', val);
                alarmAudio.play().then(() => { alarmAudio.pause(); alarmAudio.currentTime = 0; });
                alert("Alarm Set!");
            }
        }

        function stopAlarm() {
            alarmAudio.pause();
            document.getElementById('stopBtn').style.display = "none";
            localStorage.removeItem('userAlarm');
            activeAlarm = null;
            document.getElementById('alarmStatus').innerHTML = "";
        }

        setInterval(() => {
            let now = new Date();
            let hh = now.getHours(), mm = now.getMinutes(), ss = now.getSeconds();
            
            document.getElementById('date-box').innerHTML = now.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
            
            document.getElementById('hr').style.transform = `rotateZ(${(hh*30)+(mm/12)}deg)`;
            document.getElementById('mn').style.transform = `rotateZ(${mm*6}deg)`;
            document.getElementById('sc').style.transform = `rotateZ(${ss*6}deg)`;

            document.getElementById('hours').innerHTML = hh.toString().padStart(2,'0');
            document.getElementById('minutes').innerHTML = mm.toString().padStart(2,'0');
            document.getElementById('seconds').innerHTML = ss.toString().padStart(2,'0');

            if (activeAlarm === (hh.toString().padStart(2,'0') + ":" + mm.toString().padStart(2,'0')) && ss === 0) {
                alarmAudio.play();
                document.getElementById('stopBtn').style.display = "block";
            }
        }, 1000);
    </script>
</body>
</html>
