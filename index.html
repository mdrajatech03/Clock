<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Smart Clock - Weather Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

        :root {
            --bg-color: #e0e0e0;
            --text-color: #444;
            --shadow-light: #ffffff;
            --shadow-dark: #bebebe;
            --accent-color: #04fc43;
        }

        [data-theme="dark"] {
            --bg-color: #1a1e23;
            --text-color: #ddd;
            --shadow-light: #252a31;
            --shadow-dark: #0f1216;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; transition: 0.3s; }

        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: var(--bg-color); padding: 20px;
        }

        /* Top Bar Features */
        .top-bar {
            position: fixed; top: 15px; width: 90%; max-width: 400px;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }

        .info-pill {
            padding: 6px 12px; border-radius: 20px; font-size: 0.75em; font-weight: 600;
            background: var(--bg-color); color: var(--text-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            display: flex; align-items: center; gap: 5px;
        }

        .theme-switch {
            padding: 8px 15px; border-radius: 20px; border: none; cursor: pointer;
            background: var(--bg-color); color: var(--text-color); font-weight: 600;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        /* Main Container */
        .container {
            background: var(--bg-color); border-radius: 40px;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            display: flex; flex-direction: column; align-items: center;
            padding: 30px 20px; width: 100%; max-width: 380px; margin-top: 40px;
        }

        #weather-box { font-size: 0.85em; color: var(--accent-color); font-weight: 600; margin-bottom: 10px; }
        #quote-box { font-size: 0.75em; color: var(--text-color); font-style: italic; text-align: center; margin-bottom: 20px; height: 35px; opacity: 0.8; }

        /* Analog Clock Fix (No Ring) */
        .clock {
            position: relative; width: 220px; height: 220px;
            background: var(--bg-color); border-radius: 50%; border: none;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light),
                        inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            display: flex; justify-content: center; align-items: center; margin-bottom: 25px;
        }

        .clock span { position: absolute; inset: 12px; text-align: center; color: var(--text-color); transform: rotate(calc(30deg * var(--i))); opacity: 0.4; }
        .clock span b { display: inline-block; transform: rotate(calc(-30deg * var(--i))); }

        .circle { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; }
        .circle i { position: absolute; border-radius: 6px; transform-origin: bottom; background: var(--clr); }
        #hr i { height: 22%; width: 6px; top: 28%; }
        #mn i { height: 32%; width: 4px; top: 18%; }
        #sc i { height: 38%; width: 2px; top: 12%; }

        /* Digital Display */
        #time-display {
            display: flex; align-items: center; gap: 8px; margin-bottom: 20px; 
            font-size: 1.8em; font-weight: 600; color: var(--text-color);
            background: var(--bg-color); padding: 10px 20px; border-radius: 15px;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }

        /* Controls */
        .controls { width: 100%; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        input[type="time"], input[type="color"] {
            background: var(--bg-color); border: none; padding: 10px; border-radius: 10px;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--text-color); outline: none;
        }

        button {
            padding: 10px 18px; border-radius: 20px; border: none; cursor: pointer;
            background: var(--bg-color); color: var(--text-color); font-weight: 600;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        #stopBtn { color: #ff2972; display: none; }
        #alarmStatus { color: var(--accent-color); font-size: 0.8em; height: 15px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="info-pill" id="battery">🔋 --%</div>
        <div class="info-pill" id="temp-display">🌡️ --°C</div>
        <button class="theme-switch" onclick="toggleTheme()">🌓 Theme</button>
    </div>

    <audio id="alarmAudio" loop>
        <source src="https://www.soundjay.com/buttons/beep-01a.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="weather-box">Checking Weather...</div>
        <div id="quote-box">"Your time is limited, don't waste it."</div>
        
        <div class="clock">
            <div class="circle" id="hr" style="--clr:var(--text-color);"><i></i></div>
            <div class="circle" id="mn" style="--clr:#888;"><i></i></div>
            <div class="circle" id="sc" style="--clr:var(--accent-color);"><i></i></div>
            <span style="--i:1;"><b>1</b></span><span style="--i:2;"><b>2</b></span><span style="--i:3;"><b>3</b></span>
            <span style="--i:4;"><b>4</b></span><span style="--i:5;"><b>5</b></span><span style="--i:6;"><b>6</b></span>
            <span style="--i:7;"><b>7</b></span><span style="--i:8;"><b>8</b></span><span style="--i:9;"><b>9</b></span>
            <span style="--i:10;"><b>10</b></span><span style="--i:11;"><b>11</b></span><span style="--i:12;"><b>12</b></span>
        </div>

        <div id="time-display">
            <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds" style="color:var(--accent-color);">00</span>
        </div>

        <div class="controls">
            <input type="time" id="alarmTime">
            <div style="display: flex; gap:10px;">
                <button onclick="setAlarm()">Set Alarm</button>
                <button id="stopBtn" onclick="stopAlarm()">Stop</button>
            </div>
            <p id="alarmStatus"></p>
            <div style="display:flex; align-items:center; gap:10px; font-size:0.8em; color:var(--text-color);">
                <span>Color:</span>
                <input type="color" id="colorPicker" value="#04fc43" onchange="changeAccent(this.value)">
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('alarmAudio');
        let activeAlarm = localStorage.getItem('userAlarm');
        const quotes = ["Believe in yourself!", "Time is gold.", "Success is a journey.", "Focus on the good."];

        // --- WEATHER LOGIC ---
        // Aapko OpenWeatherMap se apni API Key leni hogi (Free hai)
        const API_KEY = "ca20508697617b874b4c2487d2b91370"; 
        
        function getWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`)
                        .then(res => res.json())
                        .then(data => {
                            document.getElementById('weather-box').innerText = `${data.name}: ${data.weather[0].main}`;
                            document.getElementById('temp-display').innerText = `🌡️ ${Math.round(data.main.temp)}°C`;
                        })
                        .catch(() => document.getElementById('weather-box').innerText = "Weather Unavailable");
                });
            }
        }
        getWeather();

        // --- THEME & ACCENT ---
        function toggleTheme() {
            const body = document.body;
            const target = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
        }
        if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        function changeAccent(color) {
            document.documentElement.style.setProperty('--accent-color', color);
            localStorage.setItem('accentColor', color);
        }

        // --- BATTERY ---
        if(navigator.getBattery) {
            navigator.getBattery().then(bat => {
                const update = () => document.getElementById('battery').innerText = `🔋 ${Math.round(bat.level * 100)}%`;
                update(); bat.onlevelchange = update;
            });
        }

        // --- ALARM ---
        function setAlarm() {
            const val = document.getElementById('alarmTime').value;
            if(val) {
                activeAlarm = val;
                localStorage.setItem('userAlarm', val);
                audio.play().then(() => { audio.pause(); audio.currentTime = 0; });
                alert("Alarm Set!");
            }
        }

        function stopAlarm() {
            audio.pause(); activeAlarm = null;
            localStorage.removeItem('userAlarm');
            document.getElementById('stopBtn').style.display = "none";
        }

        // --- MAIN LOOP ---
        let qCount = 0;
        setInterval(() => {
            let now = new Date();
            let hh = now.getHours().toString().padStart(2,'0');
            let mm = now.getMinutes().toString().padStart(2,'0');
            let ss = now.getSeconds();

            document.getElementById('hr').style.transform = `rotateZ(${(now.getHours()*30)+(now.getMinutes()/12)}deg)`;
            document.getElementById('mn').style.transform = `rotateZ(${now.getMinutes()*6}deg)`;
            document.getElementById('sc').style.transform = `rotateZ(${ss*6}deg)`;

            document.getElementById('hours').innerText = hh;
            document.getElementById('minutes').innerText = mm;
            document.getElementById('seconds').innerText = ss.toString().padStart(2,'0');

            if (activeAlarm === (hh + ":" + mm) && ss === 0) {
                audio.play();
                document.getElementById('stopBtn').style.display = "inline-block";
            }

            if(ss % 15 === 0) {
                document.getElementById('quote-box').innerText = `"${quotes[qCount % quotes.length]}"`;
                qCount++;
            }
        }, 1000);
    </script>
</body>
</html>
