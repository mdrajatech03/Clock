<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Clock Pro - Sound Selector</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

        :root {
            --bg-color: #e0e0e0;
            --text-color: #444;
            --shadow-light: #ffffff;
            --shadow-dark: #bebebe;
            --accent-color: #04fc43;
        }

        [data-theme="dark"] {
            --bg-color: #1a1e23;
            --text-color: #ddd;
            --shadow-light: #252a31;
            --shadow-dark: #0f1216;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; transition: 0.3s; }

        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: var(--bg-color); padding: 20px;
        }

        .top-bar {
            position: fixed; top: 15px; width: 90%; max-width: 400px;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }

        .info-pill {
            padding: 8px 12px; border-radius: 20px; font-size: 0.75em; font-weight: 600;
            background: var(--bg-color); color: var(--text-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        .theme-switch {
            padding: 8px 15px; border-radius: 20px; border: none; cursor: pointer;
            background: var(--bg-color); color: var(--text-color); font-weight: 600;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        .container {
            background: var(--bg-color); border-radius: 40px;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            display: flex; flex-direction: column; align-items: center;
            padding: 30px 20px; width: 100%; max-width: 380px; margin-top: 40px;
        }

        #weather-status { font-size: 0.8em; color: var(--accent-color); font-weight: 600; margin-bottom: 5px; }
        #quote-box { font-size: 0.75em; color: var(--text-color); font-style: italic; text-align: center; margin-bottom: 20px; min-height: 35px; opacity: 0.8; }

        .clock {
            position: relative; width: 220px; height: 220px;
            background: var(--bg-color); border-radius: 50%; border: none;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light),
                        inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            display: flex; justify-content: center; align-items: center; margin-bottom: 25px;
        }

        .clock span { position: absolute; inset: 15px; text-align: center; color: var(--text-color); transform: rotate(calc(30deg * var(--i))); opacity: 0.4; }
        .clock span b { display: inline-block; transform: rotate(calc(-30deg * var(--i))); }

        .circle { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; }
        .circle i { position: absolute; border-radius: 6px; transform-origin: bottom; background: var(--clr); }
        #hr i { height: 25%; width: 6px; top: 25%; }
        #mn i { height: 35%; width: 4px; top: 15%; }
        #sc i { height: 40%; width: 2px; top: 10%; }

        #time-display {
            display: flex; align-items: center; gap: 8px; margin-bottom: 25px; 
            font-size: 1.8em; font-weight: 600; color: var(--text-color);
            background: var(--bg-color); padding: 12px 20px; border-radius: 20px;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
        }

        .controls { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
        
        select, input[type="time"] {
            width: 80%; background: var(--bg-color); border: none; padding: 10px; border-radius: 12px;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--text-color); outline: none; text-align: center;
        }

        .btn-row { display: flex; gap: 10px; }
        button {
            padding: 12px 20px; border-radius: 25px; border: none; cursor: pointer;
            background: var(--bg-color); color: var(--text-color); font-weight: 600;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        #stopBtn { color: #ff2972; display: none; }
        #alarmStatus { color: var(--accent-color); font-size: 0.8em; font-weight: 600; height: 15px; }

        .config-row { display: flex; align-items: center; gap: 10px; font-size: 0.75em; color: var(--text-color); margin-top: 5px; }
        input[type="color"] { border: none; width: 25px; height: 25px; cursor: pointer; background: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="info-pill" id="battery">🔋 --%</div>
        <div class="info-pill" id="temp-display">🌡️ --°C</div>
        <button class="theme-switch" onclick="toggleTheme()">🌓 Theme</button>
    </div>

    <audio id="alarmAudio" loop preload="auto"></audio>

    <div class="container">
        <div id="weather-status">Weather: Loading...</div>
        <div id="quote-box">"Believe in yourself!"</div>
        
        <div class="clock">
            <div class="circle" id="hr" style="--clr:var(--text-color);"><i></i></div>
            <div class="circle" id="mn" style="--clr:#888;"><i></i></div>
            <div class="circle" id="sc" style="--clr:var(--accent-color);"><i></i></div>
            <span style="--i:1;"><b>1</b></span><span style="--i:2;"><b>2</b></span><span style="--i:3;"><b>3</b></span>
            <span style="--i:4;"><b>4</b></span><span style="--i:5;"><b>5</b></span><span style="--i:6;"><b>6</b></span>
            <span style="--i:7;"><b>7</b></span><span style="--i:8;"><b>8</b></span><span style="--i:9;"><b>9</b></span>
            <span style="--i:10;"><b>10</b></span><span style="--i:11;"><b>11</b></span><span style="--i:12;"><b>12</b></span>
        </div>

        <div id="time-display">
            <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds" style="color:var(--accent-color);">00</span>
        </div>

        <div class="controls">
            <select id="soundSelect" onchange="previewSound()">
                <option value="https://www.soundjay.com/buttons/beep-01a.mp3">Digital Beep</option>
                <option value="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3">Classic Bell</option>
                <option value="https://www.soundjay.com/nature/ocean-wave-1.mp3">Gentle Nature</option>
            </select>

            <input type="time" id="alarmTime">
            
            <div class="btn-row">
                <button onclick="setAlarm()">Set Alarm</button>
                <button id="stopBtn" onclick="stopAlarm()">Stop</button>
            </div>
            
            <p id="alarmStatus"></p>

            <div class="config-row">
                <span>Clock Color:</span>
                <input type="color" id="colorPicker" value="#04fc43" onchange="updateAccent(this.value)">
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('alarmAudio');
        let activeAlarm = localStorage.getItem('userAlarm');
        const quotes = ["Stay hungry, stay foolish.", "Time is gold.", "Work hard, dream big.", "Focus on your goals."];

        // 1. Sound Logic
        function previewSound() {
            audio.src = document.getElementById('soundSelect').value;
            audio.play().then(() => {
                setTimeout(() => { if(!activeAlarmIsRinging) audio.pause(); }, 2000);
            }).catch(() => {});
        }
        // Set default sound
        audio.src = document.getElementById('soundSelect').value;

        // 2. Weather Logic
        const API_KEY = "ca20508697617b874b4c2487d2b91370";
        function fetchWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&appid=${API_KEY}&units=metric`)
                    .then(r => r.json()).then(data => {
                        document.getElementById('weather-status').innerText = `${data.name}: ${data.weather[0].main}`;
                        document.getElementById('temp-display').innerText = `🌡️ ${Math.round(data.main.temp)}°C`;
                    }).catch(() => {});
                });
            }
        }
        fetchWeather();

        // 3. Alarm Functions
        let activeAlarmIsRinging = false;
        function setAlarm() {
            const timeVal = document.getElementById('alarmTime').value;
            if(timeVal) {
                activeAlarm = timeVal;
                localStorage.setItem('userAlarm', timeVal);
                localStorage.setItem('alarmSound', audio.src);
                document.getElementById('alarmStatus').innerText = "⏰ Alarm set: " + timeVal;
                // Interaction unlock
                audio.play().then(() => { audio.pause(); audio.currentTime = 0; });
                alert("Alarm Set with selected sound!");
            }
        }

        function stopAlarm() {
            audio.pause();
            audio.currentTime = 0;
            activeAlarmIsRinging = false;
            activeAlarm = null;
            localStorage.removeItem('userAlarm');
            document.getElementById('stopBtn').style.display = "none";
            document.getElementById('alarmStatus').innerText = "";
        }

        // 4. Themes
        function toggleTheme() {
            const body = document.body;
            const theme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        function updateAccent(color) {
            document.documentElement.style.setProperty('--accent-color', color);
            localStorage.setItem('accentColor', color);
        }
        if(localStorage.getItem('accentColor')) updateAccent(localStorage.getItem('accentColor'));

        // 5. Battery
        if(navigator.getBattery) {
            navigator.getBattery().then(b => {
                const up = () => document.getElementById('battery').innerText = `🔋 ${Math.round(b.level * 100)}%`;
                up(); b.onlevelchange = up;
            });
        }

        // 6. Main Clock Loop
        let qIdx = 0;
        setInterval(() => {
            const d = new Date();
            const h = d.getHours().toString().padStart(2, '0');
            const m = d.getMinutes().toString().padStart(2, '0');
            const s = d.getSeconds();

            document.getElementById('hr').style.transform = `rotate(${(d.getHours()*30)+(d.getMinutes()/12)}deg)`;
            document.getElementById('mn').style.transform = `rotate(${d.getMinutes()*6}deg)`;
            document.getElementById('sc').style.transform = `rotate(${s*6}deg)`;

            document.getElementById('hours').innerText = h;
            document.getElementById('minutes').innerText = m;
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');

            if (activeAlarm === (h + ":" + m) && s === 0) {
                activeAlarmIsRinging = true;
                audio.play().catch(() => {
                    document.getElementById('alarmStatus').innerText = "🔊 CLICK TO ENABLE SOUND!";
                    window.addEventListener('click', () => audio.play(), {once:true});
                });
                document.getElementById('stopBtn').style.display = "inline-block";
            }

            if(s % 20 === 0) {
                document.getElementById('quote-box').innerText = `"${quotes[qIdx % quotes.length]}"`;
                qIdx++;
            }
        }, 1000);

        window.onload = () => {
            if(activeAlarm) {
                document.getElementById('alarmTime').value = activeAlarm;
                document.getElementById('alarmStatus').innerText = "⏰ Active: " + activeAlarm;
            }
        };
    </script>
</body>
</html>
